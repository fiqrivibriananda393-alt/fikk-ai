<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fikk AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f0f0f;color:#fff;height:100vh;display:flex;flex-direction:column}
header{padding:16px;text-align:center;background:#1a1a1a;border-bottom:1px solid #333}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;padding:10px 14px;border-radius:16px;line-height:1.4}
.user{align-self:flex-end;background:#7c3aed}
.ai{align-self:flex-start;background:#262626;border:1px solid #333}
#bar{display:flex;gap:8px;padding:12px;background:#1a1a1a;border-top:1px solid #333}
input{flex:1;padding:12px;border-radius:24px;border:1px solid #333;background:#262626;color:#fff;outline:none}
button{padding:12px 18px;border-radius:24px;border:none;background:#7c3aed;color:#fff;font-weight:bold}
</style>
</head>
<body>
<header><h2>✨ Fikk AI</h2><small>Asisten AI kamu</small></header>
<div id="chat"><div class="msg ai">Halo! Aku Fikk AI, ada yang bisa dibantu?</div></div>
<div id="bar"><input id="input" placeholder="Tanya apa aja..."><button onclick="send()">Kirim</button></div>
<script>
const chat=document.getElementById('chat'),inp=document.getElementById('input');
async function send(){
 const text=inp.value.trim(); if(!text) return;
 chat.innerHTML+=`<div class="msg user">${text}</div>`; inp.value=''; chat.scrollTop=chat.scrollHeight;
 chat.innerHTML+=`<div class="msg ai" id="load">Mengetik...</div>`;
 try{
  const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:text}]})});
  const d=await r.json(); document.getElementById('load').remove();
  chat.innerHTML+=`<div class="msg ai">${d.reply||d.error||'Error'}</div>`;
 }catch(e){document.getElementById('load').remove(); chat.innerHTML+=`<div class="msg ai">Error: ${e.message}</div>`;}
 chat.scrollTop=chat.scrollHeight;
}
inp.addEventListener('keypress',e=>{if(e.key==='Enter') send()});
</script>
</body>
</html>
